name: Test Vulkan hand APK

on:
  push:
    branches:
      - codex/test-vulkan-hand-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm64-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Build and test the separate debug package
        run: |
          chmod +x gradlew
          ./gradlew :VulkanCompat:test -Darch=arm64 --no-daemon --stacktrace
          ./gradlew :FCL:testFordebugUnitTest --tests com.tungsten.fclcore.launch.VulkanHandDepthFixTest -Darch=arm64 --no-daemon --stacktrace
          ./gradlew :FCL:assembleFordebug -Darch=arm64 --no-daemon --stacktrace
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: vulkan-hand-test-results
          path: |
            VulkanCompat/build/reports/tests/
            FCL/build/reports/tests/
      - name: Upload separate-package APK
        uses: actions/upload-artifact@v6
        with:
          name: vulkan-hand-arm64-debug-apk
          path: FCL/build/outputs/apk/fordebug/*.apk
  baseline-control-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: f7fdfeae799d53d5b63b5ab859f7ad941611dd53
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Compare control-converter tests on unmodified baseline
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew :FCL:testFordebugUnitTest --tests com.mio.controlconverter.ControlConverterTest -Darch=arm64 --no-daemon --stacktrace
      - name: Upload baseline test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: baseline-control-test-results
          path: FCL/build/reports/tests/

name: Test Vulkan hand APK

on:
  push:
    branches:
      - codex/test-vulkan-hand-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm64-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Build and test the separate debug package
        run: |
          chmod +x gradlew
          ./gradlew :VulkanCompat:test :FCL:testFordebugUnitTest :FCL:assembleFordebug -Darch=arm64 --no-daemon --stacktrace
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: vulkan-hand-test-results
          path: |
            VulkanCompat/build/reports/tests/
            FCL/build/reports/tests/
      - name: Upload separate-package APK
        uses: actions/upload-artifact@v6
        with:
          name: vulkan-hand-arm64-debug-apk
          path: FCL/build/outputs/apk/fordebug/*.apk
